<!doctype html>
<html lang="{{ current_lang }}" dir="{{ text_direction }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f6f1">
    <link rel="manifest" href="{{ url_for('static', filename='admin.webmanifest') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/icon-192.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/icon-192.png') }}">
    <title>{{ shop_name }} | {{ t('admin.admins.title') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=asset_version) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-accounts.css', v=asset_version) }}">
</head>
<body class="admin-page">
<div class="page-shell">
    {% include "admin/_header.html" %}

    <main class="admin-accounts-main">
        <a class="button-secondary" href="{{ url_for('admin.dashboard') }}">{{ t('admin.menu.overview') }}</a>
    </main>
</div>
<script src="{{ url_for('static', filename='js/app.js', v=asset_version) }}"></script>
</body>
</html>
